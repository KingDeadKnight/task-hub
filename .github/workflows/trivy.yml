name: Trivy

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "43 5 * * 1" # weekly: new CVEs appear without any change in the repository

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    name: trivy-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: taskhub:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Fails on fixable HIGH/CRITICAL vulnerabilities only: unfixed ones are not actionable.
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: taskhub:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
